<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>



  <div class="container">
    <h1>Kanban Board</h1>

    <div class="board">
      <div class="list" id="list1">
        <h2>To Do</h2>
        <div class="card" draggable="true" id="card1">Smoke a cigarette</div>
        <div class="card" draggable="true" id="card2">Pet my cat</div>
      </div>

      <div class="list" id="list2">
        <h2>In Progress</h2>
        <div class="card" draggable="true" id="card3">Drink redbull</div>
      </div>

      <div class="list" id="list2">
        <h2>Done</h2>
      </div>

    </div>



  </div>

<Script src="js/script.js"></Script>
</body>
</html>
